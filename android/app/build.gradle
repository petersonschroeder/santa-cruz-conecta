plugins {
    id 'com.android.application'
}
android {
    namespace 'br.com.santacruzconecta.app'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.santacruzconecta.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0-beta.1'
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled false
            // Distribuição definitiva: configurar assinatura privada e permanente.
            // Nunca adicionar arquivos .jks, senhas ou chaves à árvore Git.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
