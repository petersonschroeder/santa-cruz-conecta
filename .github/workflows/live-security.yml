name: Verificação de exposição pública
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
permissions:
  contents: read
jobs:
  security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout com commit fixo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Conferir cabeçalhos, login e arquivos expostos
        run: node --test tests/live-security.test.mjs
