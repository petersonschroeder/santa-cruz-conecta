name: Android APK beta
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-beta-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: write
    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Usar Android SDK preinstalado no runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
      - name: Instalar SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK beta
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Preparar APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SantaCruzConecta-beta.apk
          sha256sum dist/SantaCruzConecta-beta.apk | tee dist/SHA256SUMS.txt
      - name: Arquivar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: SantaCruzConecta-Android-Beta
          path: |
            dist/SantaCruzConecta-beta.apk
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
      - name: Publicar primeira versão beta para download público
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.0.0-beta.1 >/dev/null 2>&1; then
            echo 'A versão beta já foi publicada. Mantendo o APK original e a assinatura.'
          else
            gh release create android-v1.0.0-beta.1 dist/SantaCruzConecta-beta.apk dist/SHA256SUMS.txt \
              --title 'Santa Cruz Conecta — Android beta 1.0.0' \
              --notes 'APK de testes. O portal exige internet. Esta versão foi assinada com uma chave de depuração temporária do GitHub Actions, por isso não é indicada para atualizações permanentes nem publicação na Play Store. Não instale versões de terceiros.' \
              --prerelease --target "$GITHUB_SHA"
          fi
