name: Auditoria semanal dos links de lojas
on:
  push:
    branches: [main]
    paths:
      - scripts/audit-links.mjs
      - .github/workflows/audit-links.yml
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 2'
permissions:
  contents: read
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout do catálogo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verificar disponibilidade técnica (sem alterar Supabase)
        run: node scripts/audit-links.mjs
